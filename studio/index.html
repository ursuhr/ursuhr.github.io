<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Studio · UrsulaHR</title>
<link rel="icon" href="assets/logo-hr.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <div class="brand"><img src="assets/logo-hr.png" alt="HR"><span class="title">Studio</span></div>
  <input class="name" id="projName" value="Reel sin título" aria-label="Nombre del proyecto">
  <label class="dur">Duración <input type="number" id="durInput" min="1" max="180" step="0.5"> s</label>
  <span class="sp"></span>
  <button class="btn" id="btnTemplates">Plantillas ▾</button>
  <button class="btn" id="btnMedia">Medios</button>
  <button class="btn" id="btnAudio">Voz / audio</button>
  <button class="btn" id="btnScript">Guion de voz</button>
  <button class="btn" id="btnOpen">Abrir</button>
  <button class="btn" id="btnSave">Guardar</button>
  <button class="btn primary" id="btnExport">Exportar video</button>
  <input type="file" id="fileMedia" accept="image/*,video/*,audio/*" multiple hidden>
  <input type="file" id="fileAudio" accept="audio/*,video/*" hidden>
  <input type="file" id="fileProject" accept=".json,application/json" hidden>
</header>

<main class="work">
  <aside class="side">
    <div class="head"><b class="title">Capas</b><span><button class="btn small" id="btnSound">♪ Sonido</button> <button class="btn small" id="btnAdd">+ Agregar</button></span></div>
    <ul id="layerList"></ul>
  </aside>

  <section class="stage">
    <div class="stagearea" id="stageArea">
      <div class="stagewrap" id="stageWrap">
        <canvas id="cv" width="1080" height="1920"></canvas>
        <div id="overlay"></div>
      </div>
    </div>
    <div class="stagebar">
      <label><input type="checkbox" id="chkSafe"> Zona segura de Instagram</label>
      <label><input type="checkbox" id="chkSnap" checked> Imán a guías</label>
      <span>Flechas: mover · Shift + flechas: 10 px · Cmd/Ctrl+Z: deshacer</span>
    </div>
  </section>

  <aside class="side right"><div id="inspector"></div></aside>
</main>

<section class="timeline">
  <div class="transport">
    <button class="btn icon" id="btnStart" title="Inicio (Home)">⏮</button>
    <button class="btn primary icon" id="btnPlay" title="Reproducir (Espacio)">▶</button>
    <span class="time" id="timeLabel">0:00.0 / 0:25.0</span>
    <label><input type="checkbox" id="chkLoop"> Repetir</label>
    <span style="flex:1"></span>
    <label>Zoom <input type="range" id="zoom" min="14" max="120" value="38"></label>
  </div>
  <div class="tlscroll" id="tlScroll"><div class="tlinner" id="tlInner"></div></div>
</section>

<div class="modal" id="exportModal">
  <div class="box">
    <h3 class="title" id="expTitle">Exportando…</h3>
    <div id="expMsg">Preparando</div>
    <div class="progress"><i id="expBar"></i></div>
    <div class="acts" id="expActs"><button class="btn" id="expCancel">Cancelar</button></div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script type="module" src="app.js"></script>
</body>
</html>
